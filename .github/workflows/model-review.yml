name: Monthly model governance review

on:
  workflow_dispatch:
  schedule:
    - cron: "30 21 1 * *"

permissions:
  contents: write

concurrency:
  group: stock-screener
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install review dependency
        run: pip install requests
      - name: Update performance review
        run: python scripts/model_governance.py
      - name: Optional independent Claude audit
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
        run: python scripts/claude_review.py
      - name: Store review results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/evaluation_history.json data/model_review.json data/ai_review.json
          git diff --cached --quiet && exit 0
          git commit -m "analysis: update model governance review"
          git push

  deploy:
    needs: review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Prepare website
        run: |
          mkdir -p public/data
          cp -R web/. public/
          cp data/results.json data/status.json data/model_review.json data/ai_review.json public/data/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
