name: Update and deploy stock screener

on:
  workflow_dispatch:
    inputs:
      reset:
        description: 最初の銘柄から再取得する
        required: false
        type: boolean
        default: false
      batch_size:
        description: 1回に取得する銘柄数
        required: false
        default: "200"
  schedule:
    - cron: "17 * * * *"
  push:
    branches:
      - main
    paths:
      - "web/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/main.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stock-screener
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect and save stock data
        id: collect
        continue-on-error: true
        env:
          BATCH_SIZE: ${{ inputs.batch_size || '200' }}
          RESET_CURSOR: ${{ inputs.reset || 'false' }}
        run: python scripts/update_stocks.py

      - name: Update model evaluation history
        if: steps.collect.outcome == 'success'
        run: python scripts/model_governance.py

      - name: Commit stored results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/results.json data/status.json data/stocks.db data/evaluation_history.json data/model_review.json
          git diff --cached --quiet && exit 0
          git commit -m "data: update stock screening results"
          git push

      - name: Fail workflow if collection failed
        if: steps.collect.outcome == 'failure'
        run: exit 1

  deploy:
    needs: update
    if: always() && needs.update.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Prepare website
        run: |
          mkdir -p public/data
          cp -R web/. public/
          cp data/results.json data/status.json data/model_review.json data/ai_review.json public/data/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4

